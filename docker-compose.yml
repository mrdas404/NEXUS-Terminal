services:
  backend:
    build: { context: ./backend }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      CORE_DB_PATH: /data/core.sqlite
      RESEARCH_DB_PATH: /data/research.sqlite
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes: [backend-data:/data]
    expose: ["3001"]
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:size=32m,noexec,nosuid]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  frontend:
    build: { context: ./frontend }
    restart: unless-stopped
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    depends_on:
      backend: { condition: service_healthy }
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/var/cache/nginx:size=16m, /var/run:size=4m, /tmp:size=8m,noexec,nosuid]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 3s
      retries: 3
  backup:
    build: { context: ./backend }
    profiles: [backup]
    environment:
      CORE_DB_PATH: /data/core.sqlite
      RESEARCH_DB_PATH: /data/research.sqlite
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    command: [node, dist/scripts/backup.js]
    volumes: [backend-data:/data, backup-data:/backups]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  backend-data:
  backup-data:
