services:
  - type: web
    name: nexus-terminal-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ready
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORE_DB_PATH
        value: /tmp/core.sqlite
      - key: RESEARCH_DB_PATH
        value: /tmp/research.sqlite
      - key: BACKUP_DIR
        value: /tmp/backups
      - key: BACKUP_RETENTION_DAYS
        value: "3"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
