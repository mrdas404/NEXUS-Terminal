name: Backend validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/quotex-edition
    paths:
      - 'backend/**'
      - '.github/workflows/backend-validation.yml'
  pull_request:
    branches:
      - feature/quotex-edition
    paths:
      - 'backend/**'
      - '.github/workflows/backend-validation.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Report dependency audit findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))},null,2))"
      - run: npm test
      - run: npm run build
